name: CI

# Reports lint, tests, and type-check on pull requests. Does not deploy.
# Require the "CI / check" status on development and production in GitHub
# branch rules so a red run can block merge.
# No step interpolates untrusted input (github.event.*) into a run: command.
on:
  pull_request:
    branches: [development, production]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
